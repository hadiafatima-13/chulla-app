<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140D0A"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chulha">
<title>Chulha — MaaSaathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500&family=Rubik:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#140D0A;--fg:#F5E8D8;--muted:#A88D75;--acc:#F0913C;--card:rgba(48, 28, 20, 0.82);--line:rgba(245,232,216,.14);
--r:14px;--glyphbg:rgba(240,145,60,.16);--tagbg:rgba(140,60,40,.3);--tagfg:#F0B48C;--btn:rgba(240,145,60,.16);--btnfg:#FFBC78;
--pillon:rgba(240,145,60,.18);--input:rgba(10,6,4,.6);--nani:rgba(180,70,50,.18);--alert:rgba(200,70,55,.2);
--alertline:rgba(200,70,55,.5);--col:620px;--serif:'Alegreya',Georgia,serif;--sans:'Rubik',system-ui,sans-serif}
#onb{background:radial-gradient(70% 60% at 50% 70%,rgba(20,13,10,.5),rgba(20,13,10,.94))}
nav#nav{top:54px;left:50%;transform:translateX(-50%);background:rgba(30,18,13,.78);border:1px solid var(--line);border-radius:16px;padding:5px;backdrop-filter:blur(14px)}
#nav .lbl{font-size:10px}
#nav button[aria-current="true"]{background:rgba(240,145,60,.14)}
#panel{left:0;right:0;bottom:0;height:62svh;background:linear-gradient(180deg,rgba(32,20,14,.8),rgba(16,10,7,.97));border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 22px 0;backdrop-filter:blur(18px)}
#panel::before{content:"";display:block;width:42px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#body{padding:10px 0 30px}
@media(min-width:901px){#panel{left:auto;right:22px;top:104px;bottom:22px;height:auto;width:min(430px,40vw);border-radius:24px;border:1px solid var(--line)}}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
canvas#world{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#boot{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;transition:opacity .7s}
#boot.gone{opacity:0;pointer-events:none}
#boot h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0}
#boot p{color:var(--muted);font-size:13px;margin:6px 0 0}
#onb{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;overflow-y:auto;transition:opacity .5s}
#onb.gone{opacity:0;pointer-events:none}
.obar{height:3px;background:var(--line);flex:none}
.obar i{display:block;height:100%;width:16%;background:var(--acc);transition:width .5s cubic-bezier(.22,.9,.3,1)}
.steps{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:34px 20px 70px}
.step{width:100%;max-width:var(--col);animation:up .45s cubic-bezier(.22,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.oe{font-size:12px;color:var(--acc);margin:0 0 8px}
.step h1{font-family:var(--serif);font-weight:400;font-size:clamp(25px,4.6vw,36px);line-height:1.15;margin:0 0 8px}
.big2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,4vw,30px);margin:0 0 4px}
.lede{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:64ch}
.bignum{text-align:center;margin:12px 0 4px}
.bignum b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(48px,11vw,80px);line-height:1;color:var(--acc)}
.bignum span{color:var(--muted);font-size:13px}
input[type=range]{width:100%;accent-color:var(--acc);margin:10px 0}
.stagenow{text-align:center;font-family:var(--serif);font-size:17px;margin:2px 0 14px;min-height:24px}
.stlab{color:var(--acc);font-size:12.5px;display:block;margin-bottom:8px}
#app{position:fixed;inset:0;z-index:20;display:none}
#app.on{display:block}
header{position:fixed;top:0;left:0;right:0;z-index:31;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--serif);font-weight:400;font-size:18px}
.brand i{font-style:normal;font-size:11px;color:var(--muted)}
.tools{display:flex;gap:6px;pointer-events:auto}
.chip{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;backdrop-filter:blur(12px)}
.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
nav#nav{position:fixed;z-index:30;display:flex;gap:3px}
#nav button{background:transparent;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center;gap:2px;padding:9px 11px;border-radius:14px;font-size:11px}
#nav button .ico{font-size:16px;line-height:1}
#nav button[aria-current="true"]{color:var(--acc)}
#panel{position:fixed;z-index:25;display:flex;flex-direction:column}
#pe{font-size:11.5px;color:var(--acc);margin:0 0 3px}
#pt{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 4px;line-height:1.18}
#pl{color:var(--muted);font-size:12.8px;margin:0;max-width:54ch}
#body{flex:1;overflow-y:auto;scrollbar-width:thin}
#body::-webkit-scrollbar{width:6px}
#body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
h3.sec{font-family:var(--serif);font-weight:400;font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:9px}
.card.flat{background:transparent;border-style:dashed}
.card b{display:block;font-size:14.5px;margin-bottom:4px}
.card p{margin:0 0 4px;color:var(--muted);font-size:13px}
.card .src{color:var(--acc);font-size:12px}
.meal{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:var(--r);padding:12px 13px;margin-bottom:8px;cursor:pointer;transition:.2s}
.meal:hover{border-color:var(--acc)}
.glyph{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--glyphbg)}
.mbody{flex:1;display:block}
.slot{display:block;font-size:11px;color:var(--acc)}
.mt{display:block;font-size:15px;font-weight:600}
.mu{display:block;font-size:11.5px;color:var(--muted);opacity:.7;margin-bottom:3px}
.mw{display:block;font-size:12.5px;color:var(--muted)}
.pick{display:block;font-size:11.5px;color:var(--acc);margin-top:5px}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:10.5px;padding:3px 8px;border-radius:999px;background:var(--tagbg);color:var(--tagfg);border:1px solid var(--line)}
.tag.cost{background:transparent;color:var(--acc)}
.btn{background:var(--btn);border:1px solid var(--acc);color:var(--btnfg);border-radius:var(--r);padding:11px 16px;font-size:14px;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.big{flex:1;min-width:60%;margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.row.nowrap{flex-wrap:nowrap}
.link{background:none;border:0;color:var(--acc);font-size:12.5px;cursor:pointer;padding:6px 0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.pill:hover{color:var(--fg);border-color:var(--acc)}
.pill[aria-pressed="true"]{background:var(--pillon);border-color:var(--acc);color:var(--acc)}
.pill[disabled]{opacity:.4;cursor:default}
label.fld{display:block;margin-bottom:14px}
label.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--input);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:var(--fg);font-size:14px}
select{max-width:130px}
input::placeholder{color:var(--muted);opacity:.6}
.mic{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--acc);background:var(--btn);color:var(--acc);font-size:17px;cursor:pointer}
.mic.live{animation:m 1.1s infinite}
@keyframes m{50%{box-shadow:0 0 0 9px var(--pillon)}}
.tabs{display:flex;gap:3px;background:var(--input);padding:4px;border-radius:var(--r);margin-bottom:14px;overflow-x:auto}
.tabs button{flex:none;border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:calc(var(--r) - 3px);font-size:12.3px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--pillon);color:var(--acc)}
.pane{display:none}.pane.on{display:block}
.note{border-inline-start:2px solid var(--acc);padding-inline-start:12px;margin:14px 0;font-size:12.8px;color:var(--muted)}
.nani{display:flex;gap:10px;background:var(--nani);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin:12px 0}
.nani .av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--glyphbg)}
.nani p{margin:0;font-size:13px}
.nani b{display:block;font-family:var(--serif);font-weight:400;color:var(--acc);margin-bottom:3px}
.kid{display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:7px;font-size:13.2px}
.kid .kico{font-size:17px}
.kid .muted{color:var(--muted);font-size:12px}
.kid button{margin-inline-start:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12.5px}
.bar span{width:38%;color:var(--muted)}
.bar i{flex:1;height:8px;border-radius:5px;background:var(--acc);min-width:2px;display:block;transition:width .5s}
.bar em{font-style:normal;color:var(--muted);width:20px;text-align:end}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.learn{text-align:start;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:var(--r);padding:12px;cursor:pointer}
.learn .ic{font-size:18px}
.learn .lt{display:block;font-size:13.8px;font-weight:600;margin:5px 0 2px}
.learn .ls{display:block;font-size:11.5px;color:var(--muted)}
.learn .lb{display:none}
.learn[aria-expanded="true"]{grid-column:1/-1;border-color:var(--acc)}
.learn[aria-expanded="true"] .lb{display:block}
.learn ul{margin:8px 0 0;padding-inline-start:16px;font-size:12.5px;color:var(--muted)}
.learn li{margin-bottom:5px}
.learn.alert{background:var(--alert);border-color:var(--alertline)}
.fmap{margin:0;padding-inline-start:20px;font-size:12.5px;color:var(--muted)}
.fmap li{margin-bottom:5px}
.fmap b{color:var(--fg);font-weight:600}
.fmap span{display:block;font-size:11.5px;color:var(--acc)}
.bub{border-radius:var(--r);padding:11px 13px;margin-bottom:8px;font-size:13.2px;max-width:92%}
.bub.me{background:var(--pillon);margin-inline-start:auto}
.bub.her{background:var(--card);border:1px solid var(--line)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:13px;margin:10px 0}
.safety{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:20px;padding-top:10px}
.prio p{margin:3px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#boot .bmsg{margin-top:10px;font-size:12px;color:var(--muted);max-width:280px;line-height:1.5}
#bootRetry{display:none;margin-top:16px;background:var(--btn);border:1px solid var(--acc);color:var(--btnfg);
 border-radius:10px;padding:9px 18px;font-size:13px;cursor:pointer}
#bootDots{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);
 margin-inline-start:2px;animation:bd 1.2s infinite}
@keyframes bd{0%,100%{opacity:.25}50%{opacity:1}}

body[dir="rtl"]{font-family:'Noto Nastaliq Urdu',var(--sans);line-height:2}
body[dir="rtl"] #pt,body[dir="rtl"] .step h1,body[dir="rtl"] h3.sec{font-family:'Noto Nastaliq Urdu',var(--serif)}
</style></head>

/* Boot watchdog: never fail silently. Does not alter scoping of later scripts. */
window.__loadOK=false;
document.getElementById('bootRetry').onclick=function(){location.reload();};
window.addEventListener('error',function(e){
  if(window.__loadOK)return;
  var el=document.getElementById('bootstatus'),dm=document.getElementById('bootDots'),mm=document.getElementById('bootmsg');
  if(el)el.textContent='Something failed to load.';
  if(dm)dm.style.display='none';
  if(mm)mm.textContent='('+(e.message||'a required file did not load')+') Check your internet connection and tap Try again below.';
  document.getElementById('bootRetry').style.display='inline-block';
});
setTimeout(function(){
  if(window.__loadOK)return;
  var el=document.getElementById('bootstatus'),mm=document.getElementById('bootmsg');
  if(el)el.textContent='Still waiting…';
  if(mm)mm.textContent='This usually means the 3D library (from cdnjs.cloudflare.com) has not finished loading. Try switching networks (mobile data instead of Wi-Fi, or turn off a VPN) and tap Try again.';
  document.getElementById('bootRetry').style.display='inline-block';
},7000);
</script>

 if(S.status==="feeding"){const s=C_ST.find(x=>S.babyM<x.to)||C_ST[C_ST.length-1];
  return Object.assign({},s,{label:S.babyM<24?S.babyM+" months old":Math.round(S.babyM/12)+" years old",prog:Math.min(1,S.babyM/24)});}

/* ---------- feature 5/6: choosing meals ---------- */
function allowed(r){
 if(S.veg&&!r.veg&&!r.egg&&!r.dairy)return 0;
 if(S.noEgg&&r.egg)return 0;
 if(S.noDairy&&r.dairy)return 0;
 if(r.cost>S.budget)return 0;
 if(S.energy===1&&!r.quick)return 0;
 if(S.routine==="rare"&&!(r.batch||r.nocook||r.quick))return 0;
 const av=(S.avoid||"").toLowerCase().split(/[,\s]+/).filter(x=>x.length>2);
 if(av.some(a=>r.keys.some(k=>k.includes(a))||r.en.toLowerCase().includes(a)))return 0;
 return 1;
}
function sc_(r,st){return r.nut.filter(n=>st.nut.includes(n)).length*3+(st.eat.includes(r.id)?2:0)+Math.random();}
function plan(){
 const st=stage(),used=[],out={};
 ["breakfast","lunch","snack","dinner"].forEach(sl=>{
  let p=REC.filter(r=>r.slot.includes(sl)&&allowed(r)&&!used.includes(r.id));
  if(!p.length)p=REC.filter(r=>r.slot.includes(sl)&&!used.includes(r.id));
  if(!p.length)p=REC.slice();
  p.sort((a,b)=>sc_(b,st)-sc_(a,st));out[sl]=p[0];used.push(p[0].id);});
 S.plan=out;
 const k=new Date().toDateString();S.log[k]=used;
 const keys=Object.keys(S.log);if(keys.length>10)delete S.log[keys[0]];
 save();return out;
}
function pickWhy(r){const st=stage(),m=r.nut.filter(n=>st.nut.includes(n)).map(n=>NUTS[n][S.lang==="ur"?1:0]);
 return m.length?B("Chosen for this stage: ","اس مرحلے کے لیے: ")+m.join(", "):"";}
function mealHTML(r,sl){
 return `<button class="meal" data-meal="${r.id}">
  <span class="glyph">${r.em}</span><span class="mbody">
  ${sl?`<span class="slot">${T(sl)} · ${r.mins} min</span>`:""}
  <span class="mt">${S.lang==="ur"?r.ur:r.en}</span><span class="mu">${S.lang==="ur"?r.en:r.ur}</span>
  <span class="mw">${r.why}</span>
  <span class="tagrow">${r.nut.map(n=>`<span class="tag">${NUTS[n][S.lang==="ur"?1:0]}</span>`).join("")}<span class="tag cost">${COSTL()[r.cost]}</span></span>
  <span class="pick">${pickWhy(r)}</span></span></button>`;
}

 {k:["six month","6 month","solid","weaning","اوپری"],a:["At six months start thick mashed food alongside breast milk — khichri, mashed daal with rice, mashed banana, well-cooked egg. Two or three spoons twice a day to begin. Thick, not watery. No salt, sugar, chilli or honey before one year.","چھ ماہ پر ماں کے دودھ کے ساتھ گاڑھی میش غذا شروع کریں — کھچڑی، دال چاول، میش کیا کیلا، اچھی پکی انڈے کی زردی۔ دن میں دو بار، دو تین چمچ سے شروع کریں۔ گاڑھی ہو، پتلی نہیں۔ ایک سال سے پہلے نمک، چینی، مرچ اور شہد نہیں۔"]},
 {k:["not eating","refuse","nakhra","picky","نخرے"],a:["Offer a small portion, sit and eat together, and take it away without anger. Try the same food again another day — children often need many tries. Stop biscuits and sweet drinks between meals. Losing weight month by month means get the weight checked.","تھوڑی مقدار دیں، ساتھ بیٹھ کر کھائیں، انکار پر غصے کے بغیر ہٹا دیں۔ وہی چیز کسی اور دن پھر دیں۔ کھانوں کے درمیان بسکٹ اور میٹھے مشروب بند کریں۔ مہینہ بہ مہینہ وزن گرے تو وزن چیک کروائیں۔"]},
 {k:["avoid","parhez","unsafe","پرہیز"],a:["In pregnancy avoid raw or half-cooked eggs and meat, unboiled milk, cut fruit left in the open, and very salty dried fish. Keep tea and coffee light. Do not take herbal or strong medicines without asking your doctor.","حمل میں کچے یا ادھ پکے انڈے اور گوشت، بغیر ابلا دودھ، کھلے میں کٹا پھل، اور بہت نمکین سوکھی مچھلی سے پرہیز کریں۔ چائے اور کافی ہلکی رکھیں۔ ڈاکٹر سے پوچھے بغیر جڑی بوٹی یا تیز دوا نہ لیں۔"]},
 {k:["budget","paisa","cheap","sasta","بجٹ"],a:["The cheapest strong foods are daal, chana, seasonal sabzi, eggs, gur and dahi. Buy what is in season, cook one big pot and use it twice, and soak pulses overnight to save gas. One egg or a bowl of daal a day does more than any expensive packet.","سب سے سستی طاقتور چیزیں دال، چنا، موسمی سبزی، انڈے، گڑ اور دہی ہیں۔ موسمی خریدیں، ایک بڑی دیگچی پکا کر دو بار استعمال کریں، دالیں رات کو بھگو دیں۔ روز ایک انڈا یا ایک پیالی دال کسی مہنگے پیکٹ سے بہتر ہے۔"]},
 {k:["constipation","qabz","قبض"],a:["Chana, whole daal, seasonal vegetables, papaya and plenty of water usually help, along with a little walking. Do not take laxatives on your own in pregnancy — ask your doctor first, especially if there is pain or bleeding.","چنا، ثابت دال، موسمی سبزیاں، پپیتا اور کافی پانی مدد دیتے ہیں، ساتھ تھوڑی چہل قدمی۔ حمل میں اپنی مرضی سے قبض کی دوا نہ لیں — پہلے ڈاکٹر سے پوچھیں۔"]},
 {k:["diarrhoea","diarrhea","dast","ors","دست"],a:["Keep breastfeeding and give ORS after every loose stool, in small sips. Zinc for ten to fourteen days is usually advised — ask your health worker. Sunken eyes, no tears, very little urine, blood in the stool, or more than two days means go now.","دودھ پلانا جاری رکھیں اور ہر پتلے پاخانے کے بعد تھوڑا تھوڑا او آر ایس دیں۔ عموماً دس سے چودہ دن زنک دیا جاتا ہے۔ دھنسی آنکھیں، آنسو نہ آنا، کم پیشاب، پاخانے میں خون یا دو دن سے زیادہ ہو تو فوراً جائیں۔"]},
 {k:["tired","thak","energy","ہمت"],a:["On a tired day cook one pot only — khichri, or daal with yesterday's rice. Keep dahi, banana, gur and chana in the house for the days when the stove feels too far. Rest when the baby rests, and ask someone at home for one specific job.","تھکن والے دن صرف ایک دیگچی پکائیں — کھچڑی، یا کل کے چاول کے ساتھ دال۔ گھر میں دہی، کیلا، گڑ اور چنے رکھیں۔ بچہ سوئے تو آرام کریں، اور گھر والوں سے ایک مخصوص کام کہیں۔"]},
 {k:["weight","wazan","dubla","وزن"],a:["Add energy without adding bulk: a spoon of ghee in the child's food, milk instead of water in sooji, mashed banana, and one extra small meal between the main ones. Keep feeding during illness. Get the child weighed at the clinic so you see the trend.","مقدار بڑھائے بغیر توانائی بڑھائیں: بچے کے کھانے میں ایک چمچ گھی، سوجی میں دودھ، میش کیا کیلا، اور ایک اضافی چھوٹا کھانا۔ بیماری میں بھی کھلاتی رہیں۔ کلینک میں وزن کروائیں۔"]}
];
const RED=["bleeding","blood","khoon","fits","convulsion","not breathing","unconscious","behosh","severe pain","خون","دورے"];
const REDM=["This one is not for me to answer from the kitchen. What you are describing needs to be seen today — go to your nearest doctor, BHU or hospital, or call your Lady Health Worker now. Take someone with you if you can.",
 "یہ بات رسوئی سے حل ہونے والی نہیں۔ جو آپ بتا رہی ہیں اسے آج ہی دیکھنا ضروری ہے — قریبی ڈاکٹر، بی ایچ یو یا اسپتال جائیں، یا ابھی لیڈی ہیلتھ ورکر کو بلائیں۔"];
const FB=["I did not quite catch that. Try asking about iron, nausea, brain development, breastfeeding, starting solid food at six months, a child who refuses food, loose motions, or cooking on a small budget.",
 "یہ بات پوری سمجھ نہیں آئی۔ فولاد، متلی، دماغی نشوونما، دودھ پلانے، چھ ماہ پر اوپری غذا، کھانے سے انکار، دست، یا کم بجٹ کے کھانے کے بارے میں پوچھیں۔"];
function vAsk(){
 const i=S.lang==="ur"?1:0;
 const sug=S.lang==="ur"?["بچے کے دماغ کے لیے کیا کھاؤں؟","صبح متلی ہوتی ہے","فولاد کیسے بڑھاؤں؟","بچہ کھانا نہیں کھاتا","کم بجٹ میں کھانا"]
  :["What should I eat for the baby's brain?","I feel sick in the mornings","How do I get more iron?","My child refuses food","Cooking on a small budget"];
 $("#body").innerHTML=`<div id="chat"></div>
  <div class="pills">${sug.map(q=>`<button class="pill" data-q="${q}">${q}</button>`).join("")}</div>
  <div class="row nowrap"><input type="text" id="ain" placeholder="${B("Write here…","یہاں لکھیں…")}">
   <button class="mic" data-act="amic">🎙</button></div>
  <button class="btn big" data-act="ask">${B("Ask nani jaan","نانی جان سے پوچھیں")}</button>
  <p class="safety">${T("safety")}</p>`;
 if(!S.chat.length)S.chat.push({w:"her",t:B("Ask me, beta. If it is about food, feeding or the children's eating, I can help.","پوچھو بیٹا۔ کھانے، دودھ پلانے یا بچوں کی خوراک کی بات ہو تو میں بتا دوں گی۔")});
 chat();
 $("#ain").addEventListener("keydown",e=>{if(e.key==="Enter"){ask($("#ain").value);$("#ain").value="";}});
}
function chat(){
 const el=$("#chat");if(!el)return;
 el.innerHTML=S.chat.map((m,n)=>`<div class="bub ${m.w}">${m.t}${m.w==="her"?`<br><button class="link" data-sp="${n}">🔊 ${T("read")}</button>`:""}</div>`).join("");
 $("#body").scrollTop=$("#body").scrollHeight;
}
function ask(q){
 q=(q||"").trim();if(!q)return;
 S.chat.push({w:"me",t:q});
 const l=q.toLowerCase(),i=S.lang==="ur"?1:0;
 const hit=QA.find(a=>a.k.some(k=>l.includes(k)));
 S.chat.push({w:"her",t:RED.some(r=>l.includes(r))?REDM[i]:(hit?hit.a[i]:FB[i])});
 chat();SCENE.bloom();
}
/* voice in and out */
function listen(btn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert(B("Voice is not available on this device. Please type instead.","اس فون پر آواز دستیاب نہیں۔ براہ کرم لکھ کر بتائیں۔"));return null;}
 const r=new SR();r.lang=S.lang==="ur"?"ur-PK":"en-IN";r.interimResults=false;
 btn&&btn.classList.add("live");
 r.onend=r.onerror=()=>btn&&btn.classList.remove("live");
 try{r.start()}catch(e){}
 return r;
}
function speak(t){if(!window.speechSynthesis)return;
 const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,""));
 u.lang=S.lang==="ur"?"ur-PK":"en-IN";u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u);}

/* =====================  one delegated click handler  ===================== */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-go],[data-set],[data-tog],[data-multi],[data-lang],[data-act],[data-v],[data-t],[data-meal],[data-l],[data-q],[data-sp],[data-rm],[data-ad],[data-resc],[data-child],[data-rmkid],[data-bk]");
 if(!el)return;
 const d=el.dataset;

 if(d.go!==undefined){
  const n=+d.go;
  if(n>=STEPS.length){S.done=1;save();plan();enter();return;}
  S.step=Math.max(0,n);save();drawStep();return;}
 if(d.lang){S.lang=d.lang;save();if(S.done){renderChrome();go(S.view);}else drawStep();return;}
 if(d.set){S[d.set]=isNaN(+d.v)?d.v:+d.v;save();
  if(!S.done)drawStep();else if(S.view==="meals"){const cur=$(".tabs button[aria-selected=true]");const k=cur?cur.dataset.t:"plan";vMeals();tab(k);}else go(S.view);
  SCENE.setStage(stage().prog);return;}
 if(d.tog!==undefined){S[d.tog]=S[d.tog]?0:1;el.setAttribute("aria-pressed",!!S[d.tog]);save();return;}
 if(d.multi){const i=S.cookStyle.indexOf(d.multi);i<0?S.cookStyle.push(d.multi):S.cookStyle.splice(i,1);
  el.setAttribute("aria-pressed",S.cookStyle.includes(d.multi));save();return;}
 if(d.v!==undefined&&el.dataset.v&&!d.set){/* handled above */}
 if(d.t){tab(d.t);return;}
 if(d.meal){S.focusMeal=d.meal;save();
  if(S.view!=="meals"){go("meals");}else{tPlan();}
  tab("plan");SCENE.bloom();return;}
 if(d.l!==undefined){const o=el.getAttribute("aria-expanded")==="true";
  $$("[data-l]").forEach(x=>x.setAttribute("aria-expanded","false"));el.setAttribute("aria-expanded",!o);return;}
 if(d.q){ask(d.q);return;}
 if(d.sp!==undefined){speak(S.chat[+d.sp].t);return;}
 if(d.rm){S.pantry=S.pantry.filter(x=>x!==d.rm);pantry();save();return;}
 if(d.ad){addP(d.ad);return;}
 if(d.resc!==undefined){const i=S.lang==="ur"?1:0,x=RESC[+d.resc];
  $("#ro").innerHTML=`<div class="nani"><span class="av">👵</span><p><b>${x[0][i]}</b>${x[1][i]}</p></div>`;SCENE.bloom();return;}
 if(d.child!==undefined){const i=S.lang==="ur"?1:0,x=CHILD[+d.child];
  $("#chout").innerHTML=`<div class="nani"><span class="av">👵</span><p><b>${x[0][i]}</b>${x[1][i]}</p></div>`;return;}
 if(d.rmkid!==undefined){S.kids.splice(+d.rmkid,1);save();
  const b=$("#kidbox");if(b)b.innerHTML=kidList();return;}
 if(d.bk!==undefined){S.basket.splice(+d.bk,1);save();tBasket();tab("basket");return;}

 switch(d.act){
  case "addkid":{const a=+$("#kAge").value;if(isNaN(a)||$("#kAge").value==="")return;
   S.kids.push({age:a,unit:$("#kUnit").value});save();
   const b=$("#kidbox");if(b)b.innerHTML=kidList();$("#kAge").value="";SCENE.bloom();break;}
  case "reroll":plan();go("today");SCENE.bloom();break;
  case "tolimits":go("meals");tab("limits");break;
  case "redate":S.done=0;S.step=2;save();$("#app").classList.remove("on");$("#onb").classList.remove("gone");onb();break;
  case "cook":cook();break;
  case "pmic":{const r=listen(el);if(r)r.onresult=ev=>addP(ev.results[0][0].transcript);break;}
  case "amic":{const r=listen(el);if(r)r.onresult=ev=>ask(ev.results[0][0].transcript);break;}
  case "ask":ask($("#ain").value);$("#ain").value="";break;
  case "addbk":{const v=$("#bin").value.trim();if(v){S.basket.push(v);save();tBasket();tab("basket");}break;}
  case "share":{const txt=encodeURIComponent((S.lang==="ur"?"سامان کی فہرست:\n":"Shopping list:\n")+S.basket.map(x=>"• "+x).join("\n"));
   window.open("https://wa.me/?text="+txt,"_blank");break;}
  case "quality":S.quality=S.quality?0:1;el.setAttribute("aria-pressed",!!S.quality);SCENE.setQuality(S.quality);save();break;
 }
});
document.addEventListener("input",e=>{
 const el=e.target,d=el.dataset;
 if(d.r){S[d.r]=+el.value;save();
  const hh=$("#hh");if(hh&&d.r==="house")hh.textContent=S.house;
  const wv=$("#wvv");if(wv&&d.r==="week")wv.textContent=S.week;
  refreshStage();return;}
 if(d.f){S[d.f]=el.value;save();return;}
 if(d.d){
  const v=new Date(el.value);if(isNaN(v))return;
  const now=new Date();
  if(d.d==="lmp")S.week=Math.max(1,Math.min(42,Math.round((now-v)/6048e5)));
  else S.week=Math.max(1,Math.min(42,40-Math.round((v-now)/6048e5)));
  save();refreshStage();return;}
});
document.addEventListener("change",e=>{
 const el=e.target;if(el.id==="nav-v")return;
 if(el.closest("#nav"))return;
});
document.addEventListener("click",e=>{const b=e.target.closest("#nav button");if(b)go(b.dataset.v);});

function start(){
 load();
 $("#lbtn").onclick=()=>{S.lang=S.lang==="ur"?"en":"ur";save();
  if(S.done){renderChrome();go(S.view);}else drawStep();};
 $("#qbtn").setAttribute("aria-pressed",!!S.quality);
 SCENE.setQuality(S.quality);
 if(S.done){plan();enter();}else{onb();}
 setTimeout(()=>{window.__loadOK=true;$("#boot").classList.add("gone");},700);
}

</script>
<script>
/* Chulha — a clay hearth: pots fill, embers breathe, steam rises */
const SCENE=(function(){
const cv=document.getElementById('world');
const rn=new THREE.WebGLRenderer({canvas:cv,antialias:true});
rn.setSize(innerWidth,innerHeight);rn.outputEncoding=THREE.sRGBEncoding;
rn.toneMapping=THREE.ACESFilmicToneMapping;rn.toneMappingExposure=1.1;
const sc=new THREE.Scene();sc.background=new THREE.Color(0x140D0A);sc.fog=new THREE.FogExp2(0x140D0A,.042);
const cam=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,120);
sc.add(new THREE.AmbientLight(0x4A2A1C,.9));
const fire=new THREE.PointLight(0xFF8A2E,3.2,26,2);fire.position.set(0,-.3,0);sc.add(fire);
const rim=new THREE.PointLight(0x7A4A8A,.9,30,2);rim.position.set(-6,3,-4);sc.add(rim);
const clay=new THREE.MeshStandardMaterial({color:0x6B4230,roughness:.92});
/* the chulha body */
const body=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.5,1.5,32,1,true),clay);
body.position.y=-1.4;sc.add(body);
const top=new THREE.Mesh(new THREE.TorusGeometry(2.1,.22,12,40),clay);
top.rotation.x=Math.PI/2;top.position.y=-.66;sc.add(top);
const mouth=new THREE.Mesh(new THREE.BoxGeometry(1.1,.8,.4),new THREE.MeshStandardMaterial({color:0x2A160E,roughness:1}));
mouth.position.set(0,-1.6,2.35);sc.add(mouth);
/* embers inside */
const emb=[];
for(let i=0;i<26;i++){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.13+Math.random()*.1,0),
 new THREE.MeshStandardMaterial({color:0x8A2E10,emissive:0xFF6A1E,emissiveIntensity:1,roughness:.9}));
 const a=Math.random()*7,r=Math.random()*1.5;
 m.position.set(Math.cos(a)*r,-1.15+Math.random()*.2,Math.sin(a)*r);
 m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);sc.add(m);emb.push(m);}
/* the big family pot */
const pot=new THREE.Group();pot.position.y=-.1;sc.add(pot);
const potBody=new THREE.Mesh(new THREE.SphereGeometry(1.15,32,20,0,7,0,Math.PI*.62),
 new THREE.MeshStandardMaterial({color:0x3A2A22,roughness:.5,metalness:.35,side:THREE.DoubleSide}));
potBody.rotation.x=Math.PI;pot.add(potBody);
const potRim=new THREE.Mesh(new THREE.TorusGeometry(1.05,.07,10,40),
 new THREE.MeshStandardMaterial({color:0xC98F4B,roughness:.35,metalness:.6}));
potRim.rotation.x=Math.PI/2;potRim.position.y=.32;pot.add(potRim);
const stew=new THREE.Mesh(new THREE.CircleGeometry(1.0,40),
 new THREE.MeshStandardMaterial({color:0xD98C3A,roughness:.6,emissive:0x8A4A12,emissiveIntensity:.3}));
stew.rotation.x=-Math.PI/2;stew.position.y=.26;pot.add(stew);
/* nine small pots around the hearth = the nine months */
const small=[];
for(let i=0;i<9;i++){
 const g=new THREE.Group();const a=(i/9)*Math.PI*2+.3,r=3.9;
 g.position.set(Math.cos(a)*r,-1.1,Math.sin(a)*r);
 const b=new THREE.Mesh(new THREE.SphereGeometry(.42,20,14,0,7,0,Math.PI*.6),
  new THREE.MeshStandardMaterial({color:0x5C3A2A,roughness:.75}));
 b.rotation.x=Math.PI;g.add(b);
 const f=new THREE.Mesh(new THREE.CircleGeometry(.36,24),
  new THREE.MeshStandardMaterial({color:0xF0913C,emissive:0xF0913C,emissiveIntensity:.2,roughness:.6}));
 f.rotation.x=-Math.PI/2;f.position.y=.1;g.add(f);
 g.userData={f,i,a};sc.add(g);small.push(g);}
/* roti stack */
const roti=new THREE.Group();roti.position.set(3.1,-1.15,1.6);sc.add(roti);
for(let i=0;i<5;i++){const r=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.05,24),
 new THREE.MeshStandardMaterial({color:0xD9B27C,roughness:.85}));
 r.position.y=i*.06;r.rotation.y=i*.6;roti.add(r);}
/* steam */
const sN=520,sp=new Float32Array(sN*3),sv=[];
for(let i=0;i<sN;i++){const a=Math.random()*7,r=Math.random()*.9;
 sp[i*3]=Math.cos(a)*r;sp[i*3+1]=.3+Math.random()*4;sp[i*3+2]=Math.sin(a)*r;sv.push(.006+Math.random()*.016);}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
const steam=new THREE.Points(sg,new THREE.PointsMaterial({color:0xF5E8D8,size:.13,transparent:true,
 opacity:.3,depthWrite:false,blending:THREE.AdditiveBlending}));sc.add(steam);
/* sparks */
const kN=160,kp=new Float32Array(kN*3),kv=[];
for(let i=0;i<kN;i++){kp[i*3]=kp[i*3+1]=kp[i*3+2]=0;kv.push(new THREE.Vector3());}
const kg=new THREE.BufferGeometry();kg.setAttribute('position',new THREE.BufferAttribute(kp,3));
